name: Publish public cache

on:
  status:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to retry (defaults to current main)
        required: false
        type: string

permissions:
  contents: read
  statuses: read

defaults:
  run:
    shell: bash

jobs:
  select:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.state == 'success' &&
        (github.event.context == 'ci/hercules/evaluation' ||
         github.event.context == 'ci/hercules/onPush/default')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Select a successful main build
        id: select
        uses: actions/github-script@v9
        with:
          script: &check-build |
            const required = ['ci/hercules/evaluation', 'ci/hercules/onPush/default'];
            const recheck = Boolean(process.env.PUBLICATION_SHA);
            const manual = context.eventName === 'workflow_dispatch';
            if (context.ref !== 'refs/heads/main' ||
                !['status', 'workflow_dispatch'].includes(context.eventName)) {
              throw new Error('Publication must run from main');
            }
            if (!manual && (!required.includes(context.payload.context) ||
                            context.payload.state !== 'success')) {
              throw new Error('Publication requires a successful Hercules event');
            }
            const sha = process.env.PUBLICATION_SHA || (manual
              ? context.payload.inputs?.sha || context.sha
              : context.payload.sha);
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('Publication requires a complete commit SHA');
            }
            const repository = context.repo;
            const { data: repo } = await github.rest.repos.get(repository);
            if (repo.default_branch !== 'main') {
              throw new Error('The publication workflow expects main as default branch');
            }
            const { data: main } = await github.rest.git.getRef({
              ...repository, ref: 'heads/main'
            });
            const { data: comparison } = await github.rest.repos.compareCommits({
              ...repository, base: sha, head: main.object.sha
            });
            const latest = new Map();
            for await (const { data: statuses } of github.paginate.iterator(
              github.rest.repos.listCommitStatusesForRef,
              { ...repository, ref: sha, per_page: 100 }
            )) {
              for (const status of statuses) {
                if (required.includes(status.context) && !latest.has(status.context)) {
                  latest.set(status.context, status);
                }
              }
              if (latest.size === required.length) break;
            }
            const eligible = ['ahead', 'identical'].includes(comparison.status) &&
              required.every(name => latest.get(name)?.state === 'success' &&
                latest.get(name)?.creator?.id === 47349067);
            if (!eligible) {
              const message = 'Commit is outside main or Hercules is not successful';
              if (manual || recheck) throw new Error(message);
              core.info(message);
              return;
            }
            if (recheck) {
              for (const name of ['PRIVATE_CACHE_URL', 'PUBLIC_CACHE_URL']) {
                const value = process.env[name];
                const url = new URL(value);
                if (url.protocol !== 'https:' || url.username || url.password ||
                    url.search || url.hash || /\s/.test(value)) {
                  throw new Error(`${name} must be HTTPS without credentials or query`);
                }
                core.exportVariable(name, value.replace(/\/+$/, ''));
              }
              for (const name of ['PRIVATE_CACHE_PUBLIC_KEY', 'PUBLIC_CACHE_PUBLIC_KEY']) {
                if (!process.env[name]) throw new Error(`${name} is required`);
                core.exportVariable(name, process.env[name]);
              }
            }
            core.setOutput('sha', sha);
            core.info(`Verified main commit ${sha}`);

  publish:
    needs: select
    if: needs.select.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: publish
    concurrency:
      group: public-cache-${{ needs.select.outputs.sha }}
      cancel-in-progress: false
    env:
      PUBLICATION_SHA: ${{ needs.select.outputs.sha }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - name: Verify the selected build
        uses: actions/github-script@v9
        env:
          PRIVATE_CACHE_PUBLIC_KEY: ${{ vars.PRIVATE_CACHE_PUBLIC_KEY }}
          PRIVATE_CACHE_URL: ${{ vars.PRIVATE_CACHE_URL }}
          PUBLIC_CACHE_PUBLIC_KEY: ${{ vars.PUBLIC_CACHE_PUBLIC_KEY }}
          PUBLIC_CACHE_URL: ${{ vars.PUBLIC_CACHE_URL }}
        with:
          script: *check-build
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = false
            allow-import-from-derivation = false
            builders =
            experimental-features = nix-command flakes ca-derivations
            extra-trusted-public-keys =
            max-jobs = 0
            narinfo-cache-negative-ttl = 0
            narinfo-cache-positive-ttl = 0
      - name: Restore and save the runner Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-publish-${{ runner.os }}-${{ runner.arch }}-2.34.8-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-publish-${{ runner.os }}-${{ runner.arch }}-2.34.8-
          paths: |
            ~/.cache/nix
      - name: Evaluate package outputs
        run: |
          [[ "$(git rev-parse HEAD)" == "$PUBLICATION_SHA" ]]
          git diff --quiet HEAD --
          PUBLICATION_DIR="$RUNNER_TEMP/public-cache"
          mkdir -p "$PUBLICATION_DIR"
          printf 'PUBLICATION_DIR=%s\n' "$PUBLICATION_DIR" >> "$GITHUB_ENV"
          nix eval --json --no-update-lock-file --no-write-lock-file \
            .#herculesCI.onPush.default.outputs.packages \
            --apply '
              packages:
              let
                inherit (builtins)
                  mapAttrs
                  ;
              in
              mapAttrs (
                _: outputs:
                mapAttrs (_: output: output.outPath) outputs
              ) packages
            ' > "$PUBLICATION_DIR/packages.json"
          jq -e '
            type == "object" and length > 0 and
            all(.[]; type == "object" and length > 0 and
              all(.[]; type == "string" and
                test("^/nix/store/[0-9a-df-np-sv-z]{32}-[^/[:space:]]+$")))
          ' "$PUBLICATION_DIR/packages.json" > /dev/null
          jq -r '[.[][]] | unique[]' "$PUBLICATION_DIR/packages.json" \
            > "$PUBLICATION_DIR/roots"
      - name: Connect with cache read access
        uses: tailscale/github-action@v4.2.0
        with:
          # Headscale assigns ci-cache-read through the preauth key.
          authkey: ${{ secrets.HEADSCALE_AUTH_KEY }}
          args: --login-server=${{ vars.HEADSCALE_LOGIN_SERVER }} --accept-routes=false
          hostname: github-publisher-${{ github.run_id }}-${{ github.run_attempt }}
          log-mode: quiet
          sha256sum: 50748df1045e60b5b695f19f4c56b0da36c019948b440fb456b6584a50f0d8b9
          use-cache: 'false'
          version: 1.102.4
      - name: Inspect and verify the private closure
        run: |
          nix path-info --recursive --json --json-format 1 \
            --store "$PRIVATE_CACHE_URL" --stdin < "$PUBLICATION_DIR/roots" \
            > "$PUBLICATION_DIR/source.json"
          nix store verify --recursive --no-contents --sigs-needed 1 \
            --store "$PRIVATE_CACHE_URL" \
            --option trusted-public-keys "$PRIVATE_CACHE_PUBLIC_KEY" \
            --stdin < "$PUBLICATION_DIR/roots"
          jq -r '
            "Source closure: \(length) paths, \([.[].narSize] | add) NAR bytes"
          ' "$PUBLICATION_DIR/source.json"
      - name: Recheck the build before uploading
        uses: actions/github-script@v9
        with:
          script: *check-build
      - name: Copy the closure to the public cache
        env:
          PUBLIC_CACHE_NETRC: ${{ secrets.PUBLIC_CACHE_NETRC }}
        run: |
          umask 077
          credential=$(mktemp)
          trap 'rm -f "$credential"' EXIT
          printf '%s' "$PUBLIC_CACHE_NETRC" > "$credential"
          unset PUBLIC_CACHE_NETRC
          nix copy --from "$PRIVATE_CACHE_URL" \
            --to "$PUBLIC_CACHE_URL?compression=zstd" \
            --option netrc-file "$credential" \
            --option trusted-public-keys "$PRIVATE_CACHE_PUBLIC_KEY" \
            --stdin < "$PUBLICATION_DIR/roots"
      - name: Verify the public closure
        run: |
          nix path-info --recursive --json --json-format 1 \
            --store "$PUBLIC_CACHE_URL" --stdin < "$PUBLICATION_DIR/roots" \
            > "$PUBLICATION_DIR/published.json"
          jq -e --slurpfile source "$PUBLICATION_DIR/source.json" \
            --arg signer "${PUBLIC_CACHE_PUBLIC_KEY%%:*}:" '
            def metadata: map_values({narHash, narSize, references});
            (metadata == ($source[0] | metadata)) and
            all(.[]; any(.signatures[]?; startswith($signer)))
          ' "$PUBLICATION_DIR/published.json" > /dev/null
          nix store verify --recursive --no-contents --sigs-needed 1 \
            --store "$PUBLIC_CACHE_URL" \
            --option trusted-public-keys "$PUBLIC_CACHE_PUBLIC_KEY" \
            --stdin < "$PUBLICATION_DIR/roots"
      - name: Download and verify a package output
        run: |
          probe=$(jq -r --slurpfile packages "$PUBLICATION_DIR/packages.json" '
            . as $closure | [$packages[0][][]] | unique |
            min_by($closure[.].narSize)
          ' "$PUBLICATION_DIR/source.json")
          nix store verify --sigs-needed 1 --store "$PUBLIC_CACHE_URL" \
            --option trusted-public-keys "$PUBLIC_CACHE_PUBLIC_KEY" "$probe"
          printf '%s\n' "$probe" > "$PUBLICATION_DIR/probe"
      - name: Summarize the publication
        run: |
          # Backticks in the summary are literal Markdown formatting.
          # shellcheck disable=SC2016
          {
            printf 'Published `%s` to %s.\n\n' "$PUBLICATION_SHA" "$PUBLIC_CACHE_URL"
            jq -r --slurpfile packages "$PUBLICATION_DIR/packages.json" '
              "\([$packages[0][][]] | unique | length) roots; " +
              "\(length) closure paths; \([.[].narSize] | add) NAR bytes.\n"
            ' "$PUBLICATION_DIR/source.json"
            printf '| Package | Output | Store path |\n| --- | --- | --- |\n'
            jq -r '
              to_entries | sort_by(.key)[] | .key as $package |
              .value | to_entries | sort_by(.key)[] |
              "| \($package) | \(.key) | `\(.value)` |"
            ' "$PUBLICATION_DIR/packages.json"
            printf '\nSignatures and metadata verified; downloaded and verified `%s`.\n' \
              "$(cat "$PUBLICATION_DIR/probe")"
          } >> "$GITHUB_STEP_SUMMARY"
