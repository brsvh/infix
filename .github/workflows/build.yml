name: Build packages

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Select affected packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Check out the PR merge revision and its parents
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-scope: select
      - name: Compare package derivations
        id: packages
        run: |
          base="$RUNNER_TEMP/infix-base"
          candidate="$RUNNER_TEMP/infix-candidate.json"
          previous="$RUNNER_TEMP/infix-previous.json"
          test "$(git show -s --format=%P HEAD | wc -w)" -eq 2
          git worktree add --detach "$base" "$(git rev-parse HEAD^1)"
          trap 'git worktree remove --force "$base"' EXIT

          evaluate() {
            # Both revisions use this checkout's package extraction logic.
            # shellcheck disable=SC2016
            CI_SOURCE="$1" nix eval --json --impure \
              --no-update-lock-file --no-write-lock-file \
              --expr '
                let
                  flake = builtins.getFlake (
                    builtins.getEnv "CI_SOURCE"
                  );
                in
                (import ./ci/packages.nix {
                  nixpkgs = flake.inputs.nixpkgs;
                  overlay = flake.overlays.default;
                  system = "x86_64-linux";
                }).manifest
              '
          }

          evaluate "$GITHUB_WORKSPACE" > "$candidate"

          if ! evaluate "$base" > "$previous"; then
            echo '::warning::Base evaluation failed; building all CI packages.'
            echo '{}' > "$previous"
          fi

          packages=$(jq -cn \
            --slurpfile candidate "$candidate" \
            --slurpfile previous "$previous" '
              $candidate[0] | to_entries |
              map(select(.value != $previous[0][.key]) | .key) | sort
            ')
          echo "Selected packages: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }}
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - name: Check out the PR merge revision
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-scope: build-${{ matrix.package }}
      - name: Build every output of the selected package
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          # Nix interpolation must reach the evaluator unchanged.
          # shellcheck disable=SC2016
          nix build --no-link --print-build-logs --impure \
            --no-update-lock-file --no-write-lock-file \
            --expr '
              let
                flake = builtins.getFlake (
                  builtins.getEnv "GITHUB_WORKSPACE"
                );

                catalog = import ./ci/packages.nix {
                  nixpkgs = flake.inputs.nixpkgs;
                  overlay = flake.overlays.default;
                  system = "x86_64-linux";
                };
              in
              builtins.attrValues
                catalog.packageOutputs.${builtins.getEnv "PACKAGE"}
            '

  result:
    name: Package builds
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all selected package builds succeeded
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$SELECTION_RESULT" != success ]]; then
            echo 'Package selection did not succeed.' >&2
            exit 1
          fi

          if [[ "$PACKAGES" == '[]' && "$BUILD_RESULT" == skipped ]]; then
            echo 'No packages were affected.'
          elif [[ "$BUILD_RESULT" == success ]]; then
            echo 'All affected packages built successfully.'
          else
            echo 'One or more package builds did not succeed.' >&2
            exit 1
          fi
