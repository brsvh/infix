name: Check flake

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  flake:
    name: Flake checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the PR merge revision
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-scope: check
      - name: Check source formatting
        run: nix fmt --no-update-lock-file --no-write-lock-file -- --ci
      - name: Check flake outputs and run flake checks
        run: nix flake check --no-update-lock-file --no-write-lock-file --print-build-logs
